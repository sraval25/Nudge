<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NUDGE 4.0</title><link rel="icon" type="image/png" href="assets/nudge-logo.png"><link rel="apple-touch-icon" sizes="192x192" href="assets/nudge-icon-192.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#f8f1ea"><link rel="stylesheet" href="css/style.css"></head>
<body>
<div id="auth" class="auth-shell">
  <div class="auth-art"><img class="auth-logo" src="assets/nudge-logo.png" alt="NUDGE logo"><p class="eyebrow">NUDGE 4.0</p><h1>Your little push to do the thing.</h1><p>Beautiful on the outside. Ruthless about procrastination on the inside.</p></div>
  <div class="auth-panel"><div class="brand"><img src="assets/nudge-logo.png" alt="NUDGE" class="brand-logo"></div><div class="auth-tabs"><button class="auth-tab active" data-auth="signin">Sign in</button><button class="auth-tab" data-auth="signup">Create account</button></div>
    <form id="authForm"><label id="nameWrap">Name / username<input id="authName" required placeholder="XYZ"></label><label id="emailWrap">Email<input id="authEmail" type="email" placeholder="you@example.com"></label><label>Password<input id="authPassword" type="password" required minlength="4" placeholder="••••••••"></label><button class="primary" type="submit" id="authSubmit">Enter NUDGE →</button></form><p class="demo-note">Demo mode: accounts are stored in this browser only. No real passwords leave this device.</p></div>
</div>
<div id="app" class="app-shell hidden">
<header class="topbar"><div><p class="eyebrow" id="timeLabel">GOOD EVENING</p><h1 id="greeting">Good evening, NUDGE user</h1><p class="date" id="dateLabel"></p></div><div class="top-actions"><button class="avatar" id="profileBtn">N</button><button class="icon-button" id="settingsButton">⚙️</button></div></header>
<main id="main"></main>
<nav class="bottom-nav"><button class="nav-item active" data-screen="home">⌂<span>Home</span></button><button class="nav-item" data-screen="calendar">▣<span>Calendar</span></button><button class="nav-item" data-screen="tasks">✓<span>Tasks</span></button><button class="nav-item" data-screen="habits">↻<span>Habits</span></button><button class="nav-item" data-screen="more">•••<span>More</span></button></nav>
</div>
<div id="toast" class="toast"></div><div id="modal" class="modal hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/backend.js"></script><script src="js/app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(err=>console.warn("NUDGE service worker registration failed",err)));}</script></body></html>
